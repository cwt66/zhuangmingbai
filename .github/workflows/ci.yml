name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 中文字体：服务端 PDF 需要；缺了 /demo.pdf 会明确 503，但 CI 就测不到 PDF 这条链路
      - name: CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: All reproducible checks
        run: bash scripts/check_all.sh
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            out/alignment_report.md
            out/golden_eval.md
            out/ablation.md
          if-no-files-found: ignore
