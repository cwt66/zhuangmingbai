name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 中文字体：服务端 PDF 需要；缺了 /demo.pdf 会明确 503，但 CI 就测不到 PDF 这条链路
      - name: CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: All reproducible checks
        run: bash scripts/check_all.sh
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            out/alignment_report.md
            out/golden_eval.md
            out/ablation.md
            out/claim_ledger.md
            out/showcase_consistency.md
          if-no-files-found: ignore

  # 第二个 job：从 HEAD 建一个干净 clone，在里面跑完整 check_all。
  # 为什么必须独立：把它塞进 check_all 会无限递归。
  # 为什么必须有：撤回档案 H05 —— 冻结基线曾「本地 5/5、clone 只有 3/5」，
  # 本地永远绿、别人永远红。只有真 clone 一次才分得清。
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      # 要再从这份 checkout 里 git clone 一次，浅仓库会丢对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: Clean clone reproducibility
        run: python3 scripts/verify_clean_clone.py
      - name: Upload clean-clone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-clone-evidence
          path: out/clean_clone_report.md
          if-no-files-found: ignore

  # 第三个 job：跨环境确定性。刻意不装 requirements —— 判定链路零第三方包，
  # 用干净 venv 在 4 个 Python 版本、x86_64 runner 上比对 arm64 采集存档。
  # 本机 arm64 跑绿只算「同架构复算」；这里跑绿才让「跨指令集确定性」成立。
  determinism:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cross-environment determinism (empty venv)
        run: |
          python -m venv /tmp/zmb-empty
          /tmp/zmb-empty/bin/python eval/determinism_matrix.py --self-test --json
      - name: Upload determinism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.python-version }}
          path: out/determinism_matrix.md
          if-no-files-found: ignore

  # 第四个 job：原生 Linux aarch64。runs-on ubuntu-24.04-arm 是 GitHub 托管的
  # 真 aarch64 Linux（4C/16G，公开仓免费），不是 QEMU。
  # macOS arm64 → Linux aarch64，是把「鲲鹏同指令集」推进到「鲲鹏同 OS 家族」。
  # 边界：仍不是鲲鹏物理机 / openEuler 发行版，台账 C18 不升级。
  aarch64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native aarch64 evidence
        run: |
          uname -m
          python3 -c "import platform;print(platform.system(), platform.machine(), platform.libc_ver())"
          python3 scripts/audit_one.py data/real/feitai_budget.csv --json | python3 -c "import sys,json;d=json.load(sys.stdin);print('digest',d['digest'],'verdict',d['verdict'])"
          python3 eval/determinism_matrix.py --self-test --json --no-report
