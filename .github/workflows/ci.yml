name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 中文字体：服务端 PDF 需要；缺了 /demo.pdf 会明确 503，但 CI 就测不到 PDF 这条链路
      - name: CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: All reproducible checks
        run: bash scripts/check_all.sh
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            out/alignment_report.md
            out/golden_eval.md
            out/ablation.md
            out/claim_ledger.md
          if-no-files-found: ignore

  # 第二个 job：从 HEAD 建一个干净 clone，在里面跑完整 check_all。
  # 为什么必须独立：把它塞进 check_all 会无限递归。
  # 为什么必须有：撤回档案 H05 —— 冻结基线曾「本地 5/5、clone 只有 3/5」，
  # 本地永远绿、别人永远红。只有真 clone 一次才分得清。
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      # 要再从这份 checkout 里 git clone 一次，浅仓库会丢对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
      - name: Clean clone reproducibility
        run: python3 scripts/verify_clean_clone.py
      - name: Upload clean-clone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-clone-evidence
          path: out/clean_clone_report.md
          if-no-files-found: ignore
